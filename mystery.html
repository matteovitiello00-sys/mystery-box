<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mystery Box</title>
<style>
body { text-align:center; font-family:Arial; }
#box { display:none; margin-top:50px; cursor:pointer; font-size:60px; }
#photo { display:none; margin-top:20px; max-width:300px; }
</style>
</head>

<body>

<a href="#" onclick="showBox()">Apri la Mystery Box</a>

<div id="box" onclick="showPhoto()">🎁</div>

<img id="photo" src="foto.jpg">

<script>
function showBox() {
  document.getElementById("box").style.display = "block";
}

function showPhoto() {
  document.getElementById("photo").style.display = "block";
}
</script>

</body>
</html>
